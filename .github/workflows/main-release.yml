name: Build Pathvector DEB

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build binary
        run: |
          go mod verify
          go build -v -o pathvector .

      - name: Prepare DEB structure
        run: |
          VERSION="6.3.2-apiku1"

          mkdir -p package/DEBIAN
          mkdir -p package/usr/local/bin

          cp pathvector package/usr/local/bin/pathvector
          chmod +x package/usr/local/bin/pathvector

          cat > package/DEBIAN/control <<EOF
          Package: pathvector
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Apiku
          Description: Pathvector BGP configuration tool
          EOF

      - name: Build DEB
        run: |
          dpkg-deb --build package pathvector_6.3.2-apiku1_amd64.deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: pathvector-deb
          path: pathvector_6.3.2-apiku1_amd64.deb
