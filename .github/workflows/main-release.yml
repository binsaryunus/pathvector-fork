name: Build Pathvector

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Show Go version
        run: go version

      - name: Verify modules
        run: go mod verify

      - name: Build binary
        run: |
          go build -v -o pathvector .

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION_DEB="$(echo "$VERSION" | sed 's/-/~/g')"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            VERSION_DEB="0.0.0~dev.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_deb=$VERSION_DEB" >> "$GITHUB_OUTPUT"

          echo "Build version: $VERSION"
          echo "Debian version: $VERSION_DEB"

      - name: Prepare DEB package
        run: |
          rm -rf package

          mkdir -p package/DEBIAN
          mkdir -p package/usr/local/bin

          cp pathvector package/usr/local/bin/pathvector
          chmod 755 package/usr/local/bin/pathvector

          cat > package/DEBIAN/control <<EOF
          Package: pathvector
          Version: ${{ steps.version.outputs.version_deb }}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Apiku
          Description: Pathvector BGP configuration tool
          EOF

      - name: Show DEB control
        run: |
          cat package/DEBIAN/control

      - name: Build DEB
        run: |
          dpkg-deb --build \
            package \
            pathvector_${{ steps.version.outputs.version_deb }}_amd64.deb

      - name: Generate checksums
        run: |
          sha256sum pathvector \
            > pathvector.sha256

          sha256sum \
            pathvector_${{ steps.version.outputs.version_deb }}_amd64.deb \
            > pathvector_${{ steps.version.outputs.version_deb }}_amd64.deb.sha256

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pathvector-${{ steps.version.outputs.version }}
          path: |
            pathvector
            pathvector.sha256
            pathvector_${{ steps.version.outputs.version_deb }}_amd64.deb
            pathvector_${{ steps.version.outputs.version_deb }}_amd64.deb.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pathvector
            pathvector.sha256
            pathvector_${{ steps.version.outputs.version_deb }}_amd64.deb
            pathvector_${{ steps.version.outputs.version_deb }}_amd64.deb.sha256
          generate_release_notes: true
