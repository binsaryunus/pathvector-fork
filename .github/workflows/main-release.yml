name: Build Pathvector

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Show Go version
        run: go version

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build -v -o pathvector .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pathvector-linux-amd64
          path: pathvector
